services:
  ps-postgres:
    image: pgvector/pgvector:pg18
    container_name: ps-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ps-pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  ps-pgdata:
    driver: local